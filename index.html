    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; color: #111; font-family: "Courier New", ui-monospace, monospace; }
      main, #viewport { width: 100%; height: 100%; }
      #viewport { display: block; background: #fff; }
      #viewport .vector-line { vector-effect: non-scaling-stroke; }
      header { position: fixed; z-index: 6; top: max(1rem, env(safe-area-inset-top)); left: 50%; translate: -50% 0; width: min(92vw, 60rem); text-align: center; pointer-events: none; }
      h1 { margin: 0; color: #111; font-size: clamp(1.45rem, 4.7vw, 4.3rem); font-weight: 700; line-height: .96; letter-spacing: -.065em; text-wrap: balance; }
      .controls { position: fixed; z-index: 7; left: 50%; bottom: max(.9rem, env(safe-area-inset-bottom)); translate: -50% 0; display: flex; align-items: center; gap: .4rem; padding: .4rem; border: 2px solid #111; border-radius: 999px; background: rgba(255,255,255,.92); }
      button { min-width: 2.8rem; min-height: 2.8rem; border: 2px solid #111; border-radius: 50%; color: #111; background: #fff; font: 700 1.1rem/1 monospace; cursor: pointer; }
      button:hover, #toggle { color: #fff; background: #111; }
      button:active { transform: scale(.94); }
      button:focus-visible { outline: 3px solid #111; outline-offset: 3px; }
      output { min-width: 4rem; color: #111; font: 700 .78rem/1 monospace; text-align: center; }
      .hint { position: fixed; z-index: 6; right: 1rem; bottom: 1rem; margin: 0; font: 700 .75rem/1.3 monospace; }
      @media (max-width: 680px) { h1 { font-size: clamp(1.4rem, 8.5vw, 2.5rem); } .hint { display: none; } }
      @media (prefers-reduced-motion: reduce) { .hint { display: none; } }
    </style>
  </head>
  <body>
    <main aria-label="Nieskończona animacja śledzia z kanapką ze śledziem">
      <svg id="viewport" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Śledź z kanapką ze śledziem</title>
        <desc id="svg-desc">Prosty wektorowy śledź ze szkicu leży na kanapce i trzyma mniejszą kanapkę zawierającą tę samą scenę.</desc>
        <defs>
          <clipPath id="portal-clip"><rect x="310" y="515" width="55" height="55" /></clipPath>

          <g id="scene-background">
            <rect width="1000" height="1000" fill="#fff" />
          </g>

          <g id="scene-sketch"></g>

          <g id="scene-corrections" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
            <!-- Wkurwiona brew częściowo zasłania oko. -->
            <path class="vector-line" d="M277 465 L313 477" stroke-width="3" />
          </g>
        </defs>

        <g id="world"></g>
      </svg>

      <header><h1>śledz z kanapką ze śledziem</h1></header>
      <div class="controls" aria-label="Sterowanie animacją">
        <button id="slower" type="button" aria-label="Zwolnij">−</button>
        <button id="toggle" type="button" aria-label="Zatrzymaj animację">Ⅱ</button>
        <button id="faster" type="button" aria-label="Przyspiesz">＋</button>
        <output id="speed" aria-live="polite">1,00×</output>
      </div>
      <p class="hint">spacja: pauza · kółko: tempo</p>
    </main>

    <script>
      const svg = document.querySelector('#viewport');
      const world = document.querySelector('#world');
      const sketch = document.querySelector('#scene-sketch');
      const toggle = document.querySelector('#toggle');
      const speedOutput = document.querySelector('#speed');
      const ns = 'http://www.w3.org/2000/svg';
      const xlink = 'http://www.w3.org/1999/xlink';
      const portal = { x: 310, y: 515, scale: .055 };
      const cycleSeconds = 10;
      const state = { elapsed: 0, last: performance.now(), speed: 1, playing: !matchMedia('(prefers-reduced-motion: reduce)').matches };

      for (const points of window.SLEDZ_PATHS || []) {
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', points.map(([x, y], index) => `${index ? 'L' : 'M'}${x} ${y}`).join(' '));
        path.setAttribute('class', 'vector-line');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#111');
        path.setAttribute('stroke-width', '1.4');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        sketch.append(path);
      }

      function use(id, parent) {
        const node = document.createElementNS(ns, 'use');
        node.setAttribute('href', `#${id}`);
        node.setAttributeNS(xlink, 'href', `#${id}`);
        parent.append(node);
      }

      function buildScene(parent, depth) {
        const group = document.createElementNS(ns, 'g');
        parent.append(group);
        use('scene-background', group);
        use('scene-sketch', group);
        use('scene-corrections', group);
        if (depth > 0) {
          const clipped = document.createElementNS(ns, 'g');
          clipped.setAttribute('clip-path', 'url(#portal-clip)');
          group.append(clipped);
          const child = document.createElementNS(ns, 'g');
          child.setAttribute('transform', `translate(${portal.x} ${portal.y}) scale(${portal.scale})`);
          clipped.append(child);
          buildScene(child, depth - 1);
        }
      }

      buildScene(world, 6);

      function setPlaying(playing) {
        state.playing = playing;
        toggle.textContent = playing ? 'Ⅱ' : '▶';
        toggle.setAttribute('aria-label', playing ? 'Zatrzymaj animację' : 'Wznów animację');
      }

      function setSpeed(speed) {
        state.speed = Math.max(.25, Math.min(2.5, speed));
        speedOutput.value = `${state.speed.toFixed(2).replace('.', ',')}×`;
      }

      function render(now) {
        const delta = Math.min((now - state.last) / 1000, .08);
        state.last = now;
        if (state.playing) state.elapsed += delta * state.speed;
        const phase = (state.elapsed / cycleSeconds) % 1;
        const size = 1000 * Math.pow(portal.scale, phase);
        const travel = (1 - size / 1000) / (1 - portal.scale);
        const x = portal.x * travel;
        const y = portal.y * travel;
        svg.setAttribute('viewBox', `${x.toFixed(3)} ${y.toFixed(3)} ${size.toFixed(3)} ${size.toFixed(3)}`);
        requestAnimationFrame(render);
      }

      document.querySelector('#slower').addEventListener('click', () => setSpeed(state.speed - .25));
      document.querySelector('#faster').addEventListener('click', () => setSpeed(state.speed + .25));
      toggle.addEventListener('click', () => setPlaying(!state.playing));
      addEventListener('keydown', (event) => { if (event.code === 'Space') { event.preventDefault(); setPlaying(!state.playing); } });
      addEventListener('wheel', (event) => setSpeed(state.speed + (event.deltaY < 0 ? .1 : -.1)), { passive: true });
      setPlaying(state.playing);
      requestAnimationFrame(render);
    </script>
  </body>
